not_for_this_repo:
  - item: "go-files/lock (and go-files/trust, appdirs, write, confine)"
    why: "go-socket requires no repo of ours; gofrs/flock is called directly in listen, and the caller runs trust's walk on the folder first"
    sources: []
  - item: "any framing library for wire (and any library at all in wire), until wire left go-socket"
    why: "guests imported wire by exact path and linked only std and x/sys; a link test held it"
    sources: []
  - item: "github.com/cloudflare/tableflip, ory/graceful, pseidemann/finish, libp2p/go-socket-activation, systemd-socket-proxyd"
    why: "not taken for the listen job: tableflip banned for security (it takes inherited descriptors with no check that they are this process's, and leaves its variable to every subprocess); ory/graceful, pseidemann/finish and go-socket-activation for a preference (a different job, or no gain over go-systemd), so no ban; systemd-socket-proxyd is no module, and that it breaks peer checks is a note in listen/README.md"
    sources: []
  - item: "github.com/tailscale/peercred, natefinch/npipe, tailscale.com/client/local, tailscale.com/safesocket"
    why: "not taken for peer identity: peercred for a preference (no version to pin), so no ban; natefinch/npipe (no access list at creation), client/local (WhoIs answers wrongly behind a serve proxy) and safesocket (its pipe's access list and its socket's mode are not the program's) banned, each for the reason its row gives"
    sources: []
  - item: "goreleaser config"
    why: "a library releases with a tag and a changie entry and builds nothing"
    sources: []
  - item: "gopsutil and go-landlock"
    why: "not used here; they belong to go-proc and the programs' host ports"
    sources: []
