    state: "closed"
    note: "gone: peer/peer_darwin.go, peer/peer_xucred.go, peer/peer_xucred_test.go and the FuzzXucredUID seeds are deleted; macOS and FreeBSD read the peer at peer/peer_bsd.go:38 by unix.GetsockoptXucred, and no Syscall6 is left in any file, which the forbidigo raw-call row holds"
  - where: "listen/listen_unix.go:1-296 (aside-and-link placement, madeName, sweepAsides)"
