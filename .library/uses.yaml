# go-socket's uses file, read by a consumer's tooling: the jobs this repo does with a picked library or tool, the
# ban that keeps a second way out, and the findings each pick removed, with each ban named as the row of
# .golangci.yml that holds it.
repo: "go-socket"
plan_key_prefix: "go-socket"
is_library: true
picks:
  - item: "github.com/docker/go-connections v0.8.2 (sockets)"
    register_key: "unix-socket-listen"
    job: "make a Unix socket with its mode; never below v0.8.0"
    scope: "the listen package only"
    ban: "depguard row layer-connections (github.com/docker/go-connections outside listen), row register-bans (github.com/cloudflare/tableflip, in every file; security: it takes inherited descriptors with no check that they are this process's and leaves its variable to every subprocess); forbidigo row unix-socket-listen umask (^(syscall|unix)\\.Umask$, in every file; security: the umask is the whole process's, so a file made meanwhile takes another mode)"
    banned_calls:
      - "github.com/cloudflare/tableflip"
      - "syscall.Umask"
      - "golang.org/x/sys/unix.Umask"
    pattern: "(os|syscall|unix)\\.(Remove|Unlink)\\(|net\\.Dial(Timeout)?\\(\"unix\"|DialUnix\\("
    sources: []
  - item: "github.com/coreos/go-systemd/v22 v22.7.0 (activation)"
    register_key: "unix-socket-listen"
    job: "sockets passed by the service manager: activation.Files(true) with net.FileListener; names kept"
    scope: "the listen package only"
    ban: "depguard row layer-systemd (github.com/coreos/go-systemd outside listen); forbidigo preset row cli.config.3 (os.Getenv, os.LookupEnv, os.Environ; excluded for listen's tests, and by the preset's own exclusion for cmd/*/main.go and internal/config/, where no file is today) and row unix-socket-listen environment (^(syscall|unix|windows)\\.(Getenv|Environ)$, in every file; correctness: a passed socket comes from go-systemd's activation, which checks LISTEN_PID)"
    banned_calls:
      - "syscall.Getenv"
      - "syscall.Environ"
      - "golang.org/x/sys/unix.Getenv"
      - "golang.org/x/sys/unix.Environ"
      - "golang.org/x/sys/windows.Getenv"
      - "golang.org/x/sys/windows.Environ"
    pattern: "LISTEN_(FDS|FDNAMES|PID)"
    sources: []
  - item: "github.com/gofrs/flock v0.13.2"
    register_key: "path-lock"
    job: "the lock file <path>.lock held for the listener's life (TryLock, called directly); old enough from 22 Nov 2026"
    scope: "the listen package only (go-files is not imported: go-socket requires none of our repos)"
    ban: "depguard row os-host-flock (github.com/gofrs/flock outside listen), row register-bans (github.com/alexflint/go-filemutex and github.com/juju/fslock, in every file; security: each opens its lock file following a link and skips listen's checks, and juju/fslock reaches LockFileEx by DLL name and a raw call; github.com/nightlyone/lockfile, in every file; correctness: a pid file, not a kernel lock); forbidigo rows path-lock (^(syscall|unix)\\.Flock$ and ^windows\\.LockFileEx$, in every file; security: a hand lock skips listen's lock open, which follows no link or reparse point, and its refusals)"
    banned_calls:
      - "github.com/alexflint/go-filemutex"
      - "github.com/juju/fslock"
      - "github.com/nightlyone/lockfile"
      - "syscall.Flock"
      - "golang.org/x/sys/unix.Flock"
      - "golang.org/x/sys/windows.LockFileEx"
    sources: []
  - item: "golang.org/x/sys v0.50.0 (GetsockoptUcred, GetsockoptXucred, windows)"
    register_key: "peer-identity"
    job: "the kernel's read of who is at the other end of a Unix socket; Windows token calls, and the access list by SID of peer's pipe"
    scope: "the peer package (build-tagged files) alone"
    ban: "depguard row os-host (golang.org/x/sys outside peer: an operating-system call lives in the per-system files), row register-bans (github.com/natefinch/npipe, in every file; security: no access list set as its pipe is made, so another account can open it or take the name first; tailscale.com/client/local, in every file; correctness: WhoIs answers wrongly behind a serve proxy; tailscale.com/safesocket, in every file; security: its Windows pipe lets in every local user or its creator alone, never the program's accounts, and on Unix it removes what is at the path and sets the mode after the bind, ignoring the error); forbidigo rows peer-identity, each for security, as each reaches a call past x/sys's named calls: row peer-identity raw call (Syscall, RawSyscall, each numbered and N form, their NoError forms, and AllThreadsSyscall and AllThreadsSyscall6, of syscall or golang.org/x/sys/unix, in every file, peer's system files included) and row peer-identity proc call (Call on a Proc or LazyProc, of syscall or golang.org/x/sys/windows, in every file but the two calls x/sys does not wrap, each excepted by its file and its own source line: peer/peer_windows.go's ImpersonateNamedPipeClient and peer/peer_windows_test.go's CreateRestrictedToken), row peer-identity proc acquisition (NewLazyDLL, NewLazySystemDLL, LoadDLL, MustLoadDLL, LoadLibrary, LoadLibraryEx, GetProcAddress and its ByOrdinal form, LazyDLL.NewProc, and DLL.FindProc and DLL.MustFindProc and their ByOrdinal forms, of syscall or golang.org/x/sys/windows, in every file but the two acquisitions of those procs, each excepted by its file and its own source line, which names advapi32.dll and the proc), row peer-identity proc use (the two excepted procs used on their own Call lines alone, never copied, embedded or held as an interface), row peer-identity proc field (Name, System, Handle and Dll of DLL, LazyDLL, Proc or LazyProc, read or written, in every file) and row peer-identity proc type (DLL, LazyDLL, Proc and LazyProc named, as a literal, a field, a parameter or a return, in every file)"
    banned_calls:
      - "github.com/natefinch/npipe"
      - "tailscale.com/client/local"
      - "tailscale.com/safesocket"
      - "syscall.Syscall"
      - "syscall.Syscall6"
      - "syscall.Syscall9"
      - "syscall.Syscall12"
      - "syscall.Syscall15"
      - "syscall.Syscall18"
      - "syscall.SyscallN"
      - "syscall.RawSyscall"
      - "syscall.RawSyscall6"
      - "syscall.AllThreadsSyscall"
      - "syscall.AllThreadsSyscall6"
      - "golang.org/x/sys/unix.Syscall"
      - "golang.org/x/sys/unix.Syscall6"
      - "golang.org/x/sys/unix.Syscall9"
      - "golang.org/x/sys/unix.SyscallNoError"
      - "golang.org/x/sys/unix.RawSyscall"
      - "golang.org/x/sys/unix.RawSyscall6"
      - "golang.org/x/sys/unix.RawSyscallNoError"
      - "syscall.Proc.Call"
      - "syscall.LazyProc.Call"
      - "golang.org/x/sys/windows.Proc.Call"
      - "golang.org/x/sys/windows.LazyProc.Call"
      - "syscall.NewLazyDLL"
      - "syscall.LoadDLL"
      - "syscall.MustLoadDLL"
      - "syscall.LoadLibrary"
      - "syscall.GetProcAddress"
      - "syscall.LazyDLL.NewProc"
      - "syscall.DLL.FindProc"
      - "syscall.DLL.MustFindProc"
      - "golang.org/x/sys/windows.NewLazyDLL"
      - "golang.org/x/sys/windows.NewLazySystemDLL"
      - "golang.org/x/sys/windows.LoadDLL"
      - "golang.org/x/sys/windows.MustLoadDLL"
      - "golang.org/x/sys/windows.LoadLibrary"
      - "golang.org/x/sys/windows.LoadLibraryEx"
      - "golang.org/x/sys/windows.GetProcAddress"
      - "golang.org/x/sys/windows.GetProcAddressByOrdinal"
      - "golang.org/x/sys/windows.LazyDLL.NewProc"
      - "golang.org/x/sys/windows.DLL.FindProc"
      - "golang.org/x/sys/windows.DLL.MustFindProc"
      - "golang.org/x/sys/windows.DLL.FindProcByOrdinal"
      - "golang.org/x/sys/windows.DLL.MustFindProcByOrdinal"
      - "syscall.DLL"
      - "syscall.LazyDLL"
      - "syscall.Proc"
      - "syscall.LazyProc"
      - "syscall.LazyDLL.Name"
      - "syscall.LazyProc.Name"
      - "syscall.DLL.Name"
      - "syscall.DLL.Handle"
      - "syscall.Proc.Name"
      - "syscall.Proc.Dll"
      - "golang.org/x/sys/windows.DLL"
      - "golang.org/x/sys/windows.LazyDLL"
      - "golang.org/x/sys/windows.Proc"
      - "golang.org/x/sys/windows.LazyProc"
      - "golang.org/x/sys/windows.LazyDLL.Name"
      - "golang.org/x/sys/windows.LazyDLL.System"
      - "golang.org/x/sys/windows.LazyProc.Name"
      - "golang.org/x/sys/windows.DLL.Name"
      - "golang.org/x/sys/windows.DLL.Handle"
      - "golang.org/x/sys/windows.Proc.Name"
      - "golang.org/x/sys/windows.Proc.Dll"
    pattern: "SO_PEERCRED|LOCAL_PEERCRED|Getsockopt(Ucred|Xucred)\\("
    sources: []
  - item: "github.com/Microsoft/go-winio v0.6.4"
    register_key: "peer-identity"
    job: "the Windows named pipe, its handle through Fd(), the dial at a chosen impersonation level; listen.Listen's pipe on Windows"
    scope: "the peer package (Windows files), and listen/pipe_windows.go and its test alone"
    ban: "depguard row os-host-winio (github.com/Microsoft/go-winio outside peer, listen/pipe_windows.go and listen/pipe_windows_test.go), row register-bans (github.com/natefinch/npipe, in every file; security: no access list set as its pipe is made); the anonymous dial of DialPipe's default is refused by name at run time (peer/peer_windows.go errAnonymous), not by a lint row"
    banned_calls:
      - "github.com/natefinch/npipe"
    pattern: "winio\\.(ListenPipe|DialPipe|DialPipeContext|DialPipeAccess)\\("
    sources: []
  - item: "std encoding/json/v2"
    register_key: "json-strict"
    job: "strict decode of the Tailscale capability document: duplicate names refused by v2, unknown members by RejectUnknownMembers"
    scope: "caller package (wire, its other user, has left go-socket)"
    ban: "none: review only"
    banned_calls: []
    pattern: "\\b(oneKeyEach|exactKeys)\\b|func walk\\(|DisallowUnknownFields"
    sources: []
  - item: "std net/http, mime and strings (caller)"
    register_key: "std-small"
    job: "the HTTP-header readers of caller: LoginProxy, TailscaleServe, ParseVersion and TailscaledUID, on the standard library alone"
    scope: "the caller package; it imports neither peer nor listen"
    ban: "none: review only; depguard row layer-caller holds that caller imports neither peer nor listen"
    banned_calls: []
    pattern: "Tailscale-User-Login|Tailscale-App-Capabilities|Remote-User"
    sources: []
  - item: "std errors.ErrUnsupported"
    register_key: "std-small"
    job: "named errors that wrap ErrUnsupported: ErrNotActivated, ErrCannotSay"
    scope: "anywhere"
    ban: "none: review only"
    banned_calls: []
    pattern: "errors\\.New\\(\"[^\"]*(unsupported|not supported)"
    sources: []
  - item: "std testing and testing/synctest"
    register_key: "std-synctest"
    job: "tests on the standard library; fuzz targets with their seeds checked in"
    scope: "_test.go files only"
    ban: "none of go-socket's own (a test library not taken for a preference has no row here); the preset's row no-assert is the consumer's, not this repo's"
    banned_calls: []
    sources: []
  - item: "tool: go-task"
    register_key: "tool:go-task"
    job: "run the repo's checks as one Taskfile with the tiers pre-commit, pre-push and release"
    scope: "v3.54.0; the repo's own Taskfile.yml, members called from cmds, never deps"
    ban: "none: review only (the consumer's config check reads the repo's config)"
    banned_calls: []
    pattern: "exec\\.Command\\(\"make\"|\\.stamp\\b|tier[A-Za-z]*Pool"
    sources: []
  - item: "tool: golangci-lint"
    register_key: "tool:golangci-lint"
