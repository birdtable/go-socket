    replaced_by:
      - "golang.org/x/sys v0.50.0 (GetsockoptUcred, GetsockoptXucred, windows)"
    removed_by:
      - "go-socket-4"
    sources: []
    pattern: "syscall.GetsockoptInt with SO_PEERCRED / getsockopt Ucred read by hand in peer/peer_linux.go (two copies)"
    state: "closed"
    note: "gone: the peer is read through x/sys. peer/peer_linux.go:41 is the one read, unix.GetsockoptUcred inside raw.Control (line 36); no syscall.GetsockoptInt is left in any file, and the forbidigo raw-call row and depguard row os-host hold it so"
  - where: "peer/peer_darwin.go:1-63, peer/peer_xucred.go:1-31, peer_xucred_test.go, testdata/fuzz/FuzzXucredUID/ (raw Syscall6, unsafe struct parser)"
