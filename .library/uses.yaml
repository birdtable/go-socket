blockers:
  - ticket: "go-socket-2"
    why: "the import commit and the repo's own Taskfile and configs; go-systemd and x/sys come with it"
  - ticket: "go-socket-3"
    why: "removes the last listener and placement copy; adds go-connections and gofrs/flock; the umask and tableflip bans wait on it"
  - ticket: "go-socket-4"
    why: "removes the hand-written peer credential reads; the Syscall6 forbidigo and peercred bans wait on it"
  - ticket: "go-socket-5"
    why: "removes the duplicate-key walk and creates the caller package; json/v2 pick"
  - ticket: "go-socket-6"
    why: "wire and registry on the standard library alone; the strict decode goes"
  - ticket: "go-socket-7"
    why: "the go-winio pick and the Windows peer; the npipe ban waits on it"
  - ticket: "go-socket-8"
    why: "the rest of caller (Front, LoginProxy, Roles, names, tailnet kit)"
notes:
  - "Each finding is closed, and its note says where the code went. A closed finding stays one release as the record."
  - "Each call the matrix gave as prose is in its pick's pattern: a bind that unlinks or a dial probe (go-connections), a LISTEN_FDS reader (go-systemd), a second SO_PEERCRED or LOCAL_PEERCRED read (x/sys), a pipe made or dialled outside peer's own calls (go-winio), a duplicate-key walker or a strict decode by hand (json/v2), and each tool's hand-written stand-in. The raw-call, umask, lock and environment rows hold in every file, peer's system files included, so they hold in more files than the matrix's ban; the proc-call row holds in every file but the two calls x/sys does not wrap, each excepted by its own source line, and the proc-acquisition row in every file but the two acquisitions of those procs, each excepted by its own line; the proc-use row holds those two procs to their own Call lines, and the proc-field and proc-type rows hold in every file."
  - "A consumer's tooling regenerates its published matrix from this file."
