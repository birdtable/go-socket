name: Feature request
description: Something go-socket does not do that your program needs.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The task your program has, not only the API you would like.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: What you tried with go-socket or without it, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: The API you have in mind
      description: Optional.
      render: go
    validations:
      required: false
