# Runs go vet, go test, lint, the API check and the vulnerability check on GitHub's hosted runners:
# on Linux and Windows for every pull request, and on Linux, Windows and macOS for every push to main,
# every v tag and by hand. A newer run of one ref cancels the one still going. It holds no secret,
# and its token reads the repository's contents alone. Every module is fetched through the public Go
# module proxy alone, as a program that imports go-socket fetches them, and nothing is kept in the
# Actions cache; govulncheck reads the Go vulnerability database as well. go-socket is one module, at
# the root; the modules under tools/ pin the developer tools and no program imports them.
name: test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One run per ref: a push to a pull request's branch, or to main, cancels that ref's run still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS on a push to main, a v tag and a run by hand alone: a pull request runs Linux and
        # Windows. A macOS job the hosted pool never gives a runner ends cancelled with no step run;
        # it wants a rerun, not a debug.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit and tag: internal/contract's test finds the last tag with git describe,
          # and a one-commit clone holds none, so it would compare against nothing.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Fetches every module go.mod names, for every system: one test builds for each with no proxy.
      - name: go mod download
        run: go mod download
      # -mod=mod would let an untidy go.mod pass the steps after this. The root module alone: go mod
      # tidy -modfile=tools/<tool>.mod would add the library's own requirements to that tool's graph,
      # which the Taskfile keeps apart, so each tools/*.mod holds what go get -tool writes into an
      # empty modfile instead.
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        # The race detector needs cgo, and so a C compiler. Linux and macOS always race; Windows races
        # when go finds one, and runs without -race otherwise, which the counts step says.
        run: |
          race=-race
          if [ "$RUNNER_OS" = Windows ] && [ "$(go env CGO_ENABLED)" != 1 ]; then race=; fi
          echo "${race:-none}" > "$RUNNER_TEMP/race"
          go test -json $race -shuffle=on -count=1 ./... > "$RUNNER_TEMP/test.json"
      # Counts the passed, failed and skipped tests and subtests, writes them to the job summary and
      # the log, prints what each failed test wrote, and fails if any test failed or was skipped, or
      # none passed.
      - name: test counts
        if: ${{ !cancelled() }}
        run: |
          j="$RUNNER_TEMP/test.json"
          if [ ! -s "$j" ]; then echo "go test wrote no results"; exit 1; fi
          count() { jq -s --arg a "$1" '[.[] | select(.Test != null and .Action == $a)] | length' "$j" | tr -d '\r'; }
          passed=$(count pass); failed=$(count fail); skipped=$(count skip)
          if [ "$(cat "$RUNNER_TEMP/race")" = none ]; then race="without -race: go finds no C compiler for cgo here"; else race="with -race"; fi
          line="$RUNNER_OS: $passed passed, $failed failed, $skipped skipped, $race, -shuffle=on -count=1"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          jq -j 'select(.Action == "build-output") | .Output' "$j"
          jq -sj '[.[] | select(.Action == "fail") | {Package, Test}] as $f | .[] | select(.Action == "output" and ({Package, Test} as $k | any($f[]; . == $k))) | .Output' "$j"
          if [ "$skipped" != 0 ]; then
            echo "skipped, which this workflow allows none of:"
            jq -r 'select(.Test != null and .Action == "skip") | .Package + " " + .Test' "$j"
            exit 1
          fi
          if [ "$failed" != 0 ] || [ "$passed" = 0 ]; then exit 1; fi
      # lint, api and vuln are the tiers' own members, run through the pinned go-task as the tiers run
      # them, so CI and the local tiers hold the same checks: lint reads every system in the Taskfile's
      # SYSTEMS, api holds the surface against the last tag and between the systems, and vuln runs
      # govulncheck. Each member alone, never a tier: a tier ends in its wall-clock budget, which
      # measures the runner, not the code. Each runs whatever came before, so each result shows, and
      # writes it to the job summary. --force: a member that reads only the tree skips when its
      # checksum under .task matches, and a run here must never take a pass it did not see.
      - name: lint
        if: ${{ !cancelled() }}
        run: |
          rc=0; go tool -modfile=tools/task.mod task --force lint || rc=$?
          if [ "$rc" = 0 ]; then r=pass; else r="fail, exit $rc"; fi
          echo "$RUNNER_OS lint: $r" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: api
        if: ${{ !cancelled() }}
        run: |
          rc=0; go tool -modfile=tools/task.mod task --force api || rc=$?
          if [ "$rc" = 0 ]; then r=pass; else r="fail, exit $rc"; fi
          echo "$RUNNER_OS api: $r" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: vuln
        if: ${{ !cancelled() }}
        run: |
          rc=0; go tool -modfile=tools/task.mod task --force vuln || rc=$?
          if [ "$rc" = 0 ]; then r=pass; else r="fail, exit $rc"; fi
          echo "$RUNNER_OS vuln: $r" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
